version: "3.9"

# =============================================================================
# Outbound AI Caller — Production Compose (self-hosted deploy)
#
# Uses the pre-built image loaded from outbound-caller.tar.
# NO build context required — just Docker + a filled-in .env file.
#
# Quick start:
#   1.  docker load -i outbound-caller.tar
#   2.  cp .env.example .env && nano .env   # fill in your credentials
#   3.  docker compose -f docker-compose.prod.yml up -d
#   4.  Open http://<server-ip>:8000
# =============================================================================

services:

  # ── Dashboard + REST API ───────────────────────────────────────────────────
  server:
    image: outbound-caller:latest
    container_name: outbound-server
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - DB_PATH=/data/appointments.db
    volumes:
      - caller-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── AI Agent Worker ────────────────────────────────────────────────────────
  agent:
    image: outbound-caller:latest
    container_name: outbound-agent
    command: python agent.py start
    env_file: .env
    environment:
      - DB_PATH=/data/appointments.db
    volumes:
      - caller-data:/data
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Persistent volume ─────────────────────────────────────────────────────────
volumes:
  caller-data:
    driver: local
